[package]
name = "opengmk_guest"
version = "0.0.0"
edition = "2021"
publish = false

# The core: OpenGMK's GameMaker 8 runner driven a step at a time behind the
# exports the engine calls (src/lib.rs). Built twice from this one crate:
#   - for the miniBox guest, as a staticlib that build-guest.sh links into
#     core.wbx;
#   - for the host, as the rlib the native reference (../run-native) calls
#     exactly as the engine would.
[lib]
name = "opengmk_guest"
crate-type = ["staticlib", "rlib"]

[dependencies]
# the pinned OpenGMK checkout with this repository's patches applied
gm8emulator = { path = "../../extern/OpenGMK/gm8emulator" }
gm8exe = { path = "../../extern/OpenGMK/gm8exe" }
# the C library's maths, the same in both builds (src/mathlib.rs)
libm = "=0.2.16"
encoding_rs = "0.8"
# the settings and slot map are JSON
serde_json = "1"
# save data comes in as the .zip Export Save Data writes
zip = { version = "0.6.4", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
debug = 1
# A panic in the guest is a crash: abort, so the sandbox reports it (miniBox
# hands the guest's last words to the frontend). Profiles apply only when this
# crate is the root, so the native reference keeps unwinding.
panic = "abort"
